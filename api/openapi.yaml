openapi: 3.0.3
info:
  title: SignalWatch API
  version: 2.3.0-sessions
  description: |
    SignalWatch M4 HTTP API contract. All timestamps are UTC RFC3339 values.
    The public API covers identity, profile settings, the controlled source
    catalog, subscription CRUD, and the current user's matched arXiv papers.
    Background local matching provides explainable match reasons. M4 adds the
    subscription-scoped daily Digest (scheduled in the user timezone) and email delivery Worker; mail delivery operations
    are intentionally not exposed as public endpoints. User-supplied provider credentials provide optional paper summaries and cached Digest enrichment; Agents remain
    outside this contract. Read-only operations endpoints expose safe runtime
    status to database-authorized operator accounts; no administrative mutation
    or log-download endpoint is exposed.
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Sources
  - name: Subscriptions
  - name: Papers
  - name: Operations
security:
  - bearerAuth: []
paths:
  /api/v2/papers/{id}/ai-summary:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Papers]
      operationId: getPaperAISummary
      description: Reads current-version cached summaries after user paper authorization. Never calls a model.
      parameters:
        - name: language
          in: query
          schema: {type: string, enum: [zh, en]}
      responses:
        "200":
          description: Current summary state for each requested language.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AISummaryResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Operator accounts cannot access user AI endpoints.}
        "404": {description: Paper is not visible to the current user.}
        "503": {description: AI_DISABLED or AI_UNAVAILABLE; original paper remains available.}
    post:
      tags: [Papers]
      operationId: requestPaperAISummary
      description: Creates an on-demand user-scoped generation request using the current user's saved provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                language: {type: string, enum: [zh, en]}
      responses:
        "200":
          description: Cached result or completed failed attempt; no new task required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AISummaryResponse"}
        "202":
          description: Generation is queued or processing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AISummaryResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Operator accounts cannot access user AI endpoints.}
        "404": {description: Paper is not visible to the current user.}
        "503": {description: AI_DISABLED or AI_UNAVAILABLE.}
  /api/v2/ai/providers:
    get:
      tags: [Profile]
      operationId: listAIProviders
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Enabled fixed-endpoint providers and allowlisted models.
          content: {application/json: {schema: {$ref: "#/components/schemas/AIProviderPage"}}}
  /api/v2/ai/configuration:
    get:
      tags: [Profile]
      operationId: getAIConfiguration
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Masked current configuration.
          headers: {ETag: {$ref: "#/components/headers/AIConfigurationETag"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/AIConfiguration"}}}
    put:
      tags: [Profile]
      operationId: putAIConfiguration
      description: Validates the submitted model once before atomically saving. An omitted or empty api_key reuses the existing secret only for the same provider. A new provider requires a key. Validation waits at most 30 seconds and never retries automatically.
      parameters: [{$ref: "#/components/parameters/OptionalAIIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PutAIConfiguration"}}}}
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Tested active configuration.
          headers: {ETag: {$ref: "#/components/headers/AIConfigurationETag"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/AIConfiguration"}}}
    patch:
      tags: [Profile]
      operationId: changeAIModel
      parameters: [{$ref: "#/components/parameters/AIIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [model], properties: {model: {type: string}}}}}}
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Tested active configuration.
          headers: {ETag: {$ref: "#/components/headers/AIConfigurationETag"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/AIConfiguration"}}}
    delete:
      tags: [Profile]
      operationId: deleteAIConfiguration
      parameters: [{$ref: "#/components/parameters/AIIfMatch"}]
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "204": {description: Configuration deleted and all user AI switches disabled.}
  /api/v2/ai/configuration/secret:
    put:
      tags: [Profile]
      operationId: rotateAISecret
      parameters: [{$ref: "#/components/parameters/AIIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [api_key], properties: {api_key: {type: string, writeOnly: true, maxLength: 1024}}}}}}
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Tested active configuration.
          headers: {ETag: {$ref: "#/components/headers/AIConfigurationETag"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/AIConfiguration"}}}
  /api/v2/ai/configuration/test:
    post:
      tags: [Profile]
      operationId: testAIConfiguration
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: Connection test passed.
          headers: {ETag: {$ref: "#/components/headers/AIConfigurationETag"}}
          content: {application/json: {schema: {$ref: "#/components/schemas/AIConfiguration"}}}
        "409": {$ref: "#/components/responses/AIError"}
        "429": {$ref: "#/components/responses/AIError"}
  /api/v2/ai/usage:
    get:
      tags: [Profile]
      operationId: getAIUsage
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200": {description: Up to 30 UTC days of per-feature usage., content: {application/json: {schema: {$ref: "#/components/schemas/AIUsagePage"}}}}
  /api/v2/ai/calls:
    get:
      tags: [Profile]
      operationId: listAICalls
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: feature, in: query, schema: {type: string, enum: [config_test, paper, digest]}}
        - {name: status, in: query, schema: {type: string, enum: [started, succeeded, failed, unknown]}}
      responses:
        default: {$ref: "#/components/responses/AIError"}
        "200":
          description: User-isolated call diagnostics. Detailed records are retained for 30 days.
          content: {application/json: {schema: {$ref: "#/components/schemas/AICallPage"}}}
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: MySQL and Redis are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted. Sets a host-only HttpOnly SameSite=Lax signalwatch_session cookie scoped to /api/v2/auth, Secure in production, with a fixed default seven-day expiry. The secret is never returned in JSON. Responses use Cache-Control no-store.
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      description: Renews a short access token using the HttpOnly login cookie. Session expiry is fixed (default seven days), not extended by refresh. Concurrent renewals are supported. Requires a same-origin custom header; cross-origin access is not enabled.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SessionRequest'
      responses:
        "200":
          description: New bearer token; Cache-Control is no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403":
          description: AUTH_ORIGIN_REJECTED; missing session header or cross-site request.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        "503":
          description: AUTH_UNAVAILABLE; retain the cookie and retry later.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/v2/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      description: Idempotently revokes the current cookie session and expires its cookie. Other device sessions remain valid. Previously issued bearer tokens may remain valid until their short expiry.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionRequest'
      responses:
        "204": {description: Session revoked (or already absent) and cookie cleared.}
        "403":
          description: AUTH_ORIGIN_REJECTED.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        "503":
          description: Revocation failed; cookie is retained so logout can be retried.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/v2/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current active user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/sources:
    get:
      tags: [Sources]
      operationId: listSources
      responses:
        "200":
          description: Enabled public source catalog entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Sources]
      operationId: getSource
      responses:
        "200":
          description: Enabled public source catalog entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionLimitReached"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: source_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Stable, newest-first page of owned subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      responses:
        "200":
          description: Complete owned subscription.
          headers:
            ETag:
              $ref: "#/components/headers/SubscriptionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPatch"
      responses:
        "200":
          description: Current complete subscription after the atomic update.
          headers:
            ETag:
              $ref: "#/components/headers/SubscriptionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          description: Version conflict or enabled-subscription limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                versionConflict:
                  value:
                    code: SUBSCRIPTION_VERSION_CONFLICT
                    message: subscription version conflict
                    request_id: req_01j_example
                limitReached:
                  value:
                    code: SUBSCRIPTION_LIMIT_REACHED
                    message: enabled subscription limit reached
                    request_id: req_01j_example
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Subscriptions]
      operationId: deleteSubscription
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Subscription soft-deleted. The response has no body.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionVersionConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/papers:
    get:
      tags: [Papers]
      operationId: listMatchedPapers
      description: Returns each paper once, with all match reasons owned by the current user.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: subscription_id
          in: query
          description: Limit papers to one subscription owned by the current user.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Newest-first page ordered by first discovery time and paper ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/papers/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Papers]
      operationId: getMatchedPaper
      description: Returns a matched paper only when it belongs to at least one current-user subscription.
      responses:
        "200":
          description: Complete arXiv metadata and all current-user match reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PaperNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v2/ops/status:
    get:
      tags: [Operations]
      operationId: getOperationsStatus
      description: Read-only dependency, Worker, queue, and task status for operators.
      responses:
        "200":
          description: Best-effort status. Component outages are represented in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v2/ops/sources:
    get:
      tags: [Operations]
      operationId: listOperationsSources
      description: Read-only arXiv source checkpoints and safe latest-attempt summaries for operators.
      responses:
        "200":
          description: Source synchronization status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: signalwatch_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token returned by the login endpoint.
  parameters:
    SessionRequest:
      name: X-SignalWatch-Session
      in: header
      required: true
      schema: {type: string, enum: ["1"]}
    PositiveID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current subscription version from version or ETag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'
    AIIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current AI configuration lifecycle and revision.
      schema: {type: string, pattern: '^"[A-Za-z0-9_-]+:[1-9][0-9]*"$'}
    OptionalAIIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required when replacing an existing AI configuration; omitted on first creation.
      schema: {type: string, pattern: '^"[A-Za-z0-9_-]+:[1-9][0-9]*"$'}
  headers:
    AIConfigurationETag:
      description: Quoted decimal AI configuration lifecycle and revision when a configuration exists.
      required: false
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]+:[1-9][0-9]*"$'
    SubscriptionETag:
      description: Quoted decimal subscription version.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: signalwatch-api
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        call_id: {type: string, maxLength: 64}
        retry_after_seconds: {type: integer, minimum: 0}
        reset_at: {$ref: "#/components/schemas/UTCTimestamp"}
      example:
        code: VALIDATION_ERROR
        message: request is invalid
        request_id: req_01j_example
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          description: Must contain at least 8 Unicode characters, at least one Unicode letter and one Unicode number, and at most 72 UTF-8 bytes.
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 1
          readOnly: true
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Access-token lifetime in seconds.
    User:
      type: object
      additionalProperties: false
      required:
        - ai_enabled
        - ai_language
        - id
        - email
        - timezone
        - digest_time
        - max_items_per_digest
        - status
        - created_at
        - updated_at
      properties:
        ai_enabled: {type: boolean, default: false}
        ai_language: {type: string, enum: [zh, en], default: zh}
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 254
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          example: Asia/Shanghai
        digest_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
        max_items_per_digest:
          description: Default limit copied to new subscriptions; changing it does not update existing subscriptions.
          type: integer
          minimum: 1
          maximum: 20
        status:
          type: string
          enum: [active]
        created_at:
          $ref: "#/components/schemas/UTCTimestamp"
        updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ai_enabled: {type: boolean, default: false}
        ai_language: {type: string, enum: [zh, en], default: zh}
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone name; Local and fixed offsets are rejected.
          example: Asia/Shanghai
        digest_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:30"
        max_items_per_digest:
          description: Default limit copied to new subscriptions; changing it does not update existing subscriptions.
          type: integer
          minimum: 1
          maximum: 20
    PublicSource:
      type: object
      additionalProperties: false
      required: [id, source_key, kind, name, rule_types, allowed_categories]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        source_key:
          type: string
          minLength: 1
          maxLength: 64
          example: arxiv
        kind:
          type: string
          enum: [arxiv]
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: arXiv
        rule_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleType"
        allowed_categories:
          type: array
          uniqueItems: true
          items:
            type: string
          example: [cs.AI, cs.CL, cs.CV, cs.IR, cs.LG, cs.RO, cs.SE]
    RuleType:
      type: string
      enum: [category, include_keyword]
    Rules:
      type: object
      additionalProperties: false
      required: [category, keywords]
      properties:
        category: {type: string, minLength: 1, maxLength: 100}
        keywords:
          type: array
          maxItems: 30
          uniqueItems: true
          items: {$ref: "#/components/schemas/RuleValue"}
    CreateRules:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: {type: string, minLength: 1, maxLength: 100}
        keywords:
          type: array
          maxItems: 30
          uniqueItems: true
          default: []
          items: {$ref: "#/components/schemas/RuleValue"}
    BackfillStatus:
      type: object
      additionalProperties: false
      required: [state, processed, matched]
      properties:
        state: {type: string, enum: [pending, processing, complete, failed, cancelled]}
        processed: {type: integer, minimum: 0}
        matched: {type: integer, minimum: 0}
    RuleValue:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; consecutive Unicode whitespace is folded for text rules.
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [source_id, name, rules]
      properties:
        max_items_per_digest:
          type: integer
          minimum: 1
          maximum: 20
          description: Independent per-subscription email limit. Creation defaults to the user's current default limit.
        source_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
          default: true
        digest_ai_enabled: {type: boolean, default: false}
        digest_ai_language: {type: string, enum: [zh, en], default: zh}
        rules:
          $ref: "#/components/schemas/CreateRules"
    SubscriptionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: source_id is immutable. Supplied rules replace the complete rule set.
      properties:
        max_items_per_digest:
          type: integer
          minimum: 1
          maximum: 20
          description: Independent per-subscription email limit. Creation defaults to the user's current default limit.
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
        digest_ai_enabled: {type: boolean}
        digest_ai_language: {type: string, enum: [zh, en]}
        rules:
          $ref: "#/components/schemas/CreateRules"
    Subscription:
      type: object
      additionalProperties: false
      required:
        - backfill
        - max_items_per_digest
        - digest_ai_enabled
        - digest_ai_language
        - id
        - source
        - name
        - objective
        - enabled
        - version
        - rules
        - created_at
        - updated_at
      properties:
        backfill: {$ref: "#/components/schemas/BackfillStatus"}
        max_items_per_digest:
          type: integer
          minimum: 1
          maximum: 20
          description: Independent per-subscription email limit. Creation defaults to the user's current default limit.
        digest_ai_enabled: {type: boolean}
        digest_ai_language: {type: string, enum: [zh, en]}
        id:
          type: integer
          format: int64
          minimum: 1
        source:
          $ref: "#/components/schemas/PublicSource"
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
        version:
          type: integer
          format: int32
          minimum: 1
        rules:
          $ref: "#/components/schemas/Rules"
        created_at:
          $ref: "#/components/schemas/UTCTimestamp"
        updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
    SubscriptionPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    PaperMatch:
      type: object
      additionalProperties: false
      required:
        - subscription_id
        - subscription_name
        - category
        - subscription_active
        - matched_keywords
        - matched_at
      properties:
        subscription_id:
          type: integer
          format: int64
          minimum: 1
        subscription_name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: "#/components/schemas/RuleValue"
        subscription_active:
          type: boolean
        matched_keywords:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        matched_at:
          $ref: "#/components/schemas/UTCTimestamp"
    Paper:
      type: object
      additionalProperties: false
      required:
        - id
        - source_id
        - arxiv_id
        - title
        - abstract
        - comments
        - authors
        - categories
        - published_at
        - arxiv_updated_at
        - arxiv_url
        - pdf_url
        - first_seen_at
        - matches
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        source_id:
          type: integer
          format: int64
          minimum: 1
        arxiv_id:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
        abstract:
          type: string
        comments:
          type: string
        authors:
          type: array
          items:
            type: string
            minLength: 1
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        published_at:
          $ref: "#/components/schemas/UTCTimestamp"
        arxiv_updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
        arxiv_url:
          type: string
          format: uri
        pdf_url:
          type: string
          format: uri
        first_seen_at:
          $ref: "#/components/schemas/UTCTimestamp"
        matches:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaperMatch"
    PaperPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Paper"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    NullableObjective:
      type: string
      nullable: true
      maxLength: 500
      description: Blank input is normalized to null; nonblank input is trimmed.
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp.
      example: "2026-09-05T08:30:00Z"
    OperationsFailure:
      type: object
      additionalProperties: false
      required: [stage, summary, at]
      properties:
        stage:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
          description: Sanitized summary that excludes credentials and raw internal errors.
        at:
          $ref: "#/components/schemas/UTCTimestamp"
    OperationsQueue:
      type: object
      additionalProperties: false
      required: [depth, capacity, workers, processing, succeeded, failed]
      properties:
        skipped: {type: integer, minimum: 0}
        lease_conflicts: {type: integer, minimum: 0}
        retried: {type: integer, minimum: 0}
        depth: {type: integer, minimum: 0}
        capacity: {type: integer, minimum: 0}
        workers: {type: integer, minimum: 0}
        processing: {type: integer, format: int64, minimum: 0}
        succeeded: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
    OperationsWorker:
      type: object
      additionalProperties: false
      required: [instance_id, state, started_at, last_heartbeat_at, heartbeat_interval_seconds, matcher_queue, mail_queue]
      properties:
        instance_id: {type: string, minLength: 1}
        state: {type: string, enum: [running, stopped]}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_heartbeat_at: {$ref: "#/components/schemas/UTCTimestamp"}
        heartbeat_interval_seconds: {type: integer, format: int64, minimum: 0}
        matcher_queue: {$ref: "#/components/schemas/OperationsQueue"}
        mail_queue: {$ref: "#/components/schemas/OperationsQueue"}
        online_state: {type: string, enum: [online, stale, stopped]}
    OperationsTask:
      type: object
      additionalProperties: false
      required: [task, state, updated_at]
      properties:
        task: {type: string, enum: [collector, matcher, digest, mail, ai, backfill]}
        worker_instance_id: {type: string}
        state: {type: string, enum: [idle, running, succeeded, failed, retry_wait, cancelled]}
        trigger: {type: string, enum: [startup, daily]}
        mode: {type: string, enum: [bootstrap, recovery, daily]}
        attempt_id: {type: string}
        due_at: {$ref: "#/components/schemas/UTCTimestamp"}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        updated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_success_at: {$ref: "#/components/schemas/UTCTimestamp"}
        next_retry_at: {$ref: "#/components/schemas/UTCTimestamp"}
        metrics:
          type: object
          additionalProperties: {type: integer}
        failure: {$ref: "#/components/schemas/OperationsFailure"}
    OperationsDependency:
      type: object
      additionalProperties: false
      required: [status, latency_ms]
      properties:
        status: {type: string, enum: [available, unavailable]}
        latency_ms: {type: integer, format: int64, minimum: 0}
    OperationsStatus:
      type: object
      additionalProperties: false
      required: [generated_at, status, dependencies, workers, tasks, sources]
      properties:
        ai:
          type: object
          description: Safe AI configuration, daily usage and local cache counters; per-Worker queue metrics are in AI task snapshots.
          additionalProperties: true
        generated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        status: {type: string, enum: [healthy, degraded, unavailable]}
        dependencies:
          type: object
          additionalProperties: false
          required: [mysql, redis]
          properties:
            mysql: {$ref: "#/components/schemas/OperationsDependency"}
            redis: {$ref: "#/components/schemas/OperationsDependency"}
        workers:
          type: array
          items: {$ref: "#/components/schemas/OperationsWorker"}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/OperationsTask"}
        sources:
          $ref: "#/components/schemas/OperationsSourceSummary"
    OperationsSourceSummary:
      type: object
      additionalProperties: false
      required: [enabled, current, stale, never_synced]
      properties:
        enabled: {type: integer, format: int64, minimum: 0}
        current: {type: integer, format: int64, minimum: 0}
        stale: {type: integer, format: int64, minimum: 0}
        never_synced: {type: integer, format: int64, minimum: 0}
    OperationsSourceAttempt:
      type: object
      additionalProperties: false
      required: [source_id, state, mode, attempt_id, started_at]
      properties:
        source_id: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [running, succeeded, failed, cancelled]}
        mode: {type: string, enum: [bootstrap, recovery, daily]}
        attempt_id: {type: string, minLength: 1}
        window_from: {$ref: "#/components/schemas/UTCTimestamp"}
        window_to: {$ref: "#/components/schemas/UTCTimestamp"}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        completed_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_success_at: {$ref: "#/components/schemas/UTCTimestamp"}
        metrics:
          type: object
          additionalProperties: {type: integer}
        failure: {$ref: "#/components/schemas/OperationsFailure"}
    OperationsSource:
      type: object
      additionalProperties: false
      required: [id, source_key, name, enabled, allowed_categories, paper_count, checkpoint_state, operational_state]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        source_key: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        enabled: {type: boolean}
        allowed_categories:
          type: array
          uniqueItems: true
          items: {type: string}
        paper_count: {type: integer, format: int64, minimum: 0}
        latest_paper_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_successful_sync_at: {$ref: "#/components/schemas/UTCTimestamp"}
        checkpoint_state: {type: string, enum: [current, stale, never_synced, disabled]}
        operational_state: {type: string, enum: [available, unavailable]}
        latest_attempt: {$ref: "#/components/schemas/OperationsSourceAttempt"}
    OperationsSources:
      type: object
      additionalProperties: false
      required: [generated_at, items]
      properties:
        generated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        items:
          type: array
          items: {$ref: "#/components/schemas/OperationsSource"}
    AIProviderPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AIProvider"}
    AIProvider:
      type: object
      additionalProperties: false
      required: [id, name, models]
      properties:
        id: {type: string, enum: [glm, qwen, deepseek, openai, kimi]}
        name: {type: string}
        models:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, default]
            properties:
              id: {type: string}
              name: {type: string}
              default: {type: boolean}
    AIConfiguration:
      type: object
      additionalProperties: false
      required: [configured, usable]
      properties:
        generation: {type: string, minLength: 1, maxLength: 64}
        configured: {type: boolean}
        usable: {type: boolean}
        unusable_reason: {type: string, enum: [provider_disabled, model_retired, credential_invalid]}
        provider: {type: string, enum: [glm, qwen, deepseek, openai, kimi]}
        model: {type: string}
        masked_key: {type: string, pattern: '^••••.{4}$'}
        status: {type: string, enum: [active, invalid]}
        version: {type: integer, format: int64, minimum: 1}
        last_tested_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_used_at: {$ref: "#/components/schemas/UTCTimestamp"}
        created_at: {$ref: "#/components/schemas/UTCTimestamp"}
        updated_at: {$ref: "#/components/schemas/UTCTimestamp"}
    PutAIConfiguration:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: {type: string, enum: [glm, qwen, deepseek, openai, kimi]}
        model: {type: string}
        api_key: {type: string, writeOnly: true, minLength: 8, maxLength: 1024}
    AIUsagePage:
      type: object
      additionalProperties: false
      required: [from, to, items]
      properties:
        timezone: {type: string, enum: [UTC]}
        today:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [feature, daily_limit, calls, min_interval_seconds]
            properties:
              feature: {type: string, enum: [config_test, paper, digest]}
              daily_limit: {type: integer, minimum: 0, description: Zero means unlimited.}
              calls: {type: integer, minimum: 0}
              remaining: {type: integer, minimum: 0}
              reset_at: {$ref: "#/components/schemas/UTCTimestamp"}
              min_interval_seconds: {type: integer, minimum: 0}
        from: {type: string, format: date}
        to: {type: string, format: date}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, feature, calls, succeeded, failed, input_tokens, output_tokens, usage_missing]
            properties:
              day: {type: string, format: date}
              feature: {type: string, enum: [digest, paper, config_test]}
              calls: {type: integer, minimum: 0}
              succeeded: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              unknown: {type: integer, minimum: 0}
              input_tokens: {type: integer, format: int64, minimum: 0}
              output_tokens: {type: integer, format: int64, minimum: 0}
              usage_missing: {type: integer, minimum: 0}
    AICallPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, feature, provider, model, status, created_at, duration_ms, input_tokens, output_tokens, usage_known]
            properties:
              id: {type: string}
              feature: {type: string, enum: [config_test, paper, digest]}
              provider: {type: string}
              model: {type: string}
              status: {type: string, enum: [started, succeeded, failed, unknown]}
              failure_code: {type: string}
              created_at: {$ref: "#/components/schemas/UTCTimestamp"}
              started_at: {$ref: "#/components/schemas/UTCTimestamp"}
              finished_at: {$ref: "#/components/schemas/UTCTimestamp"}
              duration_ms: {type: integer, minimum: 0}
              input_tokens: {type: integer, minimum: 0}
              output_tokens: {type: integer, minimum: 0}
              usage_known: {type: boolean}
    AISummaryResponse:
      type: object
      additionalProperties: false
      required: [paper_id, input_hash, items]
      properties:
        paper_id: {type: integer, format: int64}
        input_hash: {type: string, minLength: 64, maxLength: 64}
        provider: {type: string, enum: [glm, qwen, deepseek, openai, kimi]}
        model: {type: string}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [language, state]
            properties:
              language: {type: string, enum: [zh, en]}
              state: {type: string, enum: [ready, pending, failed, unavailable]}
              failure_code: {type: string}
              retry_at: {$ref: "#/components/schemas/UTCTimestamp"}
              content: {$ref: "#/components/schemas/AISummaryContent"}
    AISummaryContent:
      type: object
      additionalProperties: false
      required: [summary, contributions, method, applications, evidence, limitations]
      properties:
        summary: {type: string, minLength: 1, maxLength: 1200}
        method: {type: string, minLength: 1, maxLength: 1200}
        limitations: {type: string, minLength: 1, maxLength: 800}
        contributions:
          type: array
          maxItems: 3
          items: {type: string, minLength: 1, maxLength: 600}
        applications:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text, inferred]
            properties:
              text: {type: string, minLength: 1, maxLength: 600}
              inferred: {type: boolean}
        evidence:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [field, quote]
            properties:
              field: {type: string, enum: [title, abstract]}
              quote: {type: string, minLength: 1, maxLength: 500}

  responses:
    AIError:
      description: Structured AI error. 409 denotes conflict or missing configuration; 422 invalid credentials/model; 429 local daily limit, admission interval or provider rate limit; 502 provider failure; 504 provider timeout; 503 application/storage unavailable. Retry-After is returned when a retry time is known. No model call is retried automatically.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: Request syntax, parameter, or business validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: request is invalid
            request_id: req_01j_example
    Unauthorized:
      description: Missing, invalid, expired, or tampered bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_UNAUTHORIZED
            message: unauthorized
            request_id: req_01j_example
    Forbidden:
      description: The authenticated account does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_FORBIDDEN
            message: forbidden
            request_id: req_01j_example
    Unavailable:
      description: Authorization or operational status assembly could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SERVICE_UNAVAILABLE
            message: operational status temporarily unavailable
            request_id: req_01j_example
    InvalidCredentials:
      description: Email or password was not accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_INVALID_CREDENTIALS
            message: invalid credentials
            request_id: req_01j_example
    EmailAlreadyRegistered:
      description: The normalized email already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: EMAIL_ALREADY_REGISTERED
            message: email is already registered
            request_id: req_01j_example
    SourceNotFound:
      description: Source does not exist or is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SOURCE_NOT_FOUND
            message: source not found
            request_id: req_01j_example
    SubscriptionNotFound:
      description: Subscription does not exist, is deleted, or belongs to another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SUBSCRIPTION_NOT_FOUND
            message: subscription not found
            request_id: req_01j_example
    PaperNotFound:
      description: No matched paper with this ID is visible to the current user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PAPER_NOT_FOUND
