openapi: 3.1.0
info:
  title: SignalWatch API
  version: 2.1.0-operations
  description: |
    SignalWatch M4 HTTP API contract. All timestamps are UTC RFC3339 values.
    The public API covers identity, profile settings, the controlled source
    catalog, subscription CRUD, and the current user's matched arXiv papers.
    Background local matching provides explainable match reasons. M4 adds the
    user-local daily Digest and email delivery Worker; mail delivery operations
    are intentionally not exposed as public endpoints. LLMs and Agents remain
    outside this contract. Read-only operations endpoints expose safe runtime
    status to database-authorized operator accounts; no administrative mutation
    or log-download endpoint is exposed.
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Sources
  - name: Subscriptions
  - name: Papers
  - name: Operations
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: MySQL and Redis are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current active user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sources:
    get:
      tags: [Sources]
      operationId: listSources
      responses:
        "200":
          description: Enabled public source catalog entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Sources]
      operationId: getSource
      responses:
        "200":
          description: Enabled public source catalog entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionLimitReached"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: source_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Stable, newest-first page of owned subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      responses:
        "200":
          description: Complete owned subscription.
          headers:
            ETag:
              $ref: "#/components/headers/SubscriptionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPatch"
      responses:
        "200":
          description: Current complete subscription after the atomic update.
          headers:
            ETag:
              $ref: "#/components/headers/SubscriptionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          description: Version conflict or enabled-subscription limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                versionConflict:
                  value:
                    code: SUBSCRIPTION_VERSION_CONFLICT
                    message: subscription version conflict
                    request_id: req_01j_example
                limitReached:
                  value:
                    code: SUBSCRIPTION_LIMIT_REACHED
                    message: enabled subscription limit reached
                    request_id: req_01j_example
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Subscriptions]
      operationId: deleteSubscription
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Subscription soft-deleted. The response has no body.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SubscriptionNotFound"
        "409":
          $ref: "#/components/responses/SubscriptionVersionConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/papers:
    get:
      tags: [Papers]
      operationId: listMatchedPapers
      description: Returns each paper once, with all match reasons owned by the current user.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: subscription_id
          in: query
          description: Limit papers to one subscription owned by the current user.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Newest-first page ordered by first discovery time and paper ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/papers/{id}:
    parameters:
      - $ref: "#/components/parameters/PositiveID"
    get:
      tags: [Papers]
      operationId: getMatchedPaper
      description: Returns a matched paper only when it belongs to at least one current-user subscription.
      responses:
        "200":
          description: Complete arXiv metadata and all current-user match reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PaperNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ops/status:
    get:
      tags: [Operations]
      operationId: getOperationsStatus
      description: Read-only dependency, Worker, queue, and task status for operators.
      responses:
        "200":
          description: Best-effort status. Component outages are represented in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/ops/sources:
    get:
      tags: [Operations]
      operationId: listOperationsSources
      description: Read-only arXiv source checkpoints and safe latest-attempt summaries for operators.
      responses:
        "200":
          description: Source synchronization status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token returned by the login endpoint.
  parameters:
    PositiveID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current subscription version from version or ETag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'
  headers:
    SubscriptionETag:
      description: Quoted decimal subscription version.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: signalwatch-api
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
      example:
        code: VALIDATION_ERROR
        message: request is invalid
        request_id: req_01j_example
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          description: Must contain at least 8 Unicode characters, at least one Unicode letter and one Unicode number, and at most 72 UTF-8 bytes.
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 1
          readOnly: true
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Access-token lifetime in seconds.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - timezone
        - digest_time
        - max_items_per_digest
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 254
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          example: Asia/Shanghai
        digest_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
        max_items_per_digest:
          type: integer
          minimum: 1
          maximum: 50
        status:
          type: string
          enum: [active]
        created_at:
          $ref: "#/components/schemas/UTCTimestamp"
        updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone name; Local and fixed offsets are rejected.
          example: Asia/Shanghai
        digest_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:30"
        max_items_per_digest:
          type: integer
          minimum: 1
          maximum: 50
    PublicSource:
      type: object
      additionalProperties: false
      required: [id, source_key, kind, name, rule_types, allowed_categories]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        source_key:
          type: string
          minLength: 1
          maxLength: 64
          example: arxiv
        kind:
          type: string
          enum: [arxiv]
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: arXiv
        rule_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleType"
        allowed_categories:
          type: array
          uniqueItems: true
          items:
            type: string
          example: [cs.AI, cs.CL, cs.CV, cs.IR, cs.LG, cs.RO, cs.SE]
    RuleType:
      type: string
      enum: [category, include_keyword]
    Rules:
      type: object
      additionalProperties: false
      required: [categories, authors, include_keywords, exclude_keywords]
      properties:
        categories:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        authors:
          type: array
          maxItems: 0
          description: Compatibility response field; always empty in the five-table design.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        include_keywords:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        exclude_keywords:
          type: array
          maxItems: 0
          description: Compatibility response field; always empty in the five-table design.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
    CreateRules:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        include_keywords:
          type: array
          maxItems: 30
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/RuleValue"
    RuleValue:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; consecutive Unicode whitespace is folded for text rules.
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [source_id, name, rules]
      properties:
        source_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
          default: true
        rules:
          $ref: "#/components/schemas/CreateRules"
    SubscriptionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: source_id is immutable. Supplied rules replace the complete rule set.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
        rules:
          $ref: "#/components/schemas/CreateRules"
    Subscription:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - name
        - objective
        - enabled
        - version
        - rules
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        source:
          $ref: "#/components/schemas/PublicSource"
        name:
          type: string
          minLength: 1
          maxLength: 100
        objective:
          $ref: "#/components/schemas/NullableObjective"
        enabled:
          type: boolean
        version:
          type: integer
          format: int32
          minimum: 1
        rules:
          $ref: "#/components/schemas/Rules"
        created_at:
          $ref: "#/components/schemas/UTCTimestamp"
        updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
    SubscriptionPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    PaperMatch:
      type: object
      additionalProperties: false
      required:
        - subscription_id
        - subscription_name
        - category
        - subscription_active
        - matched_keywords
        - matched_at
      properties:
        subscription_id:
          type: integer
          format: int64
          minimum: 1
        subscription_name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: "#/components/schemas/RuleValue"
        subscription_active:
          type: boolean
        matched_keywords:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleValue"
        matched_at:
          $ref: "#/components/schemas/UTCTimestamp"
    Paper:
      type: object
      additionalProperties: false
      required:
        - id
        - source_id
        - arxiv_id
        - title
        - abstract
        - authors
        - categories
        - published_at
        - arxiv_updated_at
        - arxiv_url
        - pdf_url
        - first_seen_at
        - matches
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        source_id:
          type: integer
          format: int64
          minimum: 1
        arxiv_id:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
        abstract:
          type: string
        authors:
          type: array
          items:
            type: string
            minLength: 1
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        published_at:
          $ref: "#/components/schemas/UTCTimestamp"
        arxiv_updated_at:
          $ref: "#/components/schemas/UTCTimestamp"
        arxiv_url:
          type: string
          format: uri
        pdf_url:
          type: string
          format: uri
        first_seen_at:
          $ref: "#/components/schemas/UTCTimestamp"
        matches:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaperMatch"
    PaperPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Paper"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    NullableObjective:
      anyOf:
        - type: string
          maxLength: 500
        - enum: [null]
      description: Blank input is normalized to null; nonblank input is trimmed.
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp.
      example: "2026-09-05T08:30:00Z"
    OperationsFailure:
      type: object
      additionalProperties: false
      required: [stage, summary, at]
      properties:
        stage:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
          description: Sanitized summary that excludes credentials and raw internal errors.
        at:
          $ref: "#/components/schemas/UTCTimestamp"
    OperationsQueue:
      type: object
      additionalProperties: false
      required: [depth, capacity, workers, processing, succeeded, failed]
      properties:
        depth: {type: integer, minimum: 0}
        capacity: {type: integer, minimum: 0}
        workers: {type: integer, minimum: 0}
        processing: {type: integer, format: int64, minimum: 0}
        succeeded: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
    OperationsWorker:
      type: object
      additionalProperties: false
      required: [instance_id, state, started_at, last_heartbeat_at, heartbeat_interval_seconds, matcher_queue, mail_queue]
      properties:
        instance_id: {type: string, minLength: 1}
        state: {type: string, enum: [running, stopped]}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_heartbeat_at: {$ref: "#/components/schemas/UTCTimestamp"}
        heartbeat_interval_seconds: {type: integer, format: int64, minimum: 0}
        matcher_queue: {$ref: "#/components/schemas/OperationsQueue"}
        mail_queue: {$ref: "#/components/schemas/OperationsQueue"}
        online_state: {type: string, enum: [online, stale, stopped]}
    OperationsTask:
      type: object
      additionalProperties: false
      required: [task, state, updated_at]
      properties:
        task: {type: string, enum: [collector, matcher, digest, mail]}
        worker_instance_id: {type: string}
        state: {type: string, enum: [idle, running, succeeded, failed, retry_wait, cancelled]}
        trigger: {type: string, enum: [startup, daily]}
        mode: {type: string, enum: [bootstrap, recovery, daily]}
        attempt_id: {type: string}
        due_at: {$ref: "#/components/schemas/UTCTimestamp"}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        updated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_success_at: {$ref: "#/components/schemas/UTCTimestamp"}
        next_retry_at: {$ref: "#/components/schemas/UTCTimestamp"}
        metrics:
          type: object
          additionalProperties: {type: integer}
        failure: {$ref: "#/components/schemas/OperationsFailure"}
    OperationsDependency:
      type: object
      additionalProperties: false
      required: [status, latency_ms]
      properties:
        status: {type: string, enum: [available, unavailable]}
        latency_ms: {type: integer, format: int64, minimum: 0}
    OperationsStatus:
      type: object
      additionalProperties: false
      required: [generated_at, status, dependencies, workers, tasks, sources]
      properties:
        generated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        status: {type: string, enum: [healthy, degraded, unavailable]}
        dependencies:
          type: object
          additionalProperties: false
          required: [mysql, redis]
          properties:
            mysql: {$ref: "#/components/schemas/OperationsDependency"}
            redis: {$ref: "#/components/schemas/OperationsDependency"}
        workers:
          type: array
          items: {$ref: "#/components/schemas/OperationsWorker"}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/OperationsTask"}
        sources:
          $ref: "#/components/schemas/OperationsSourceSummary"
    OperationsSourceSummary:
      type: object
      additionalProperties: false
      required: [enabled, current, stale, never_synced]
      properties:
        enabled: {type: integer, format: int64, minimum: 0}
        current: {type: integer, format: int64, minimum: 0}
        stale: {type: integer, format: int64, minimum: 0}
        never_synced: {type: integer, format: int64, minimum: 0}
    OperationsSourceAttempt:
      type: object
      additionalProperties: false
      required: [source_id, state, mode, attempt_id, started_at]
      properties:
        source_id: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [running, succeeded, failed, cancelled]}
        mode: {type: string, enum: [bootstrap, recovery, daily]}
        attempt_id: {type: string, minLength: 1}
        window_from: {$ref: "#/components/schemas/UTCTimestamp"}
        window_to: {$ref: "#/components/schemas/UTCTimestamp"}
        started_at: {$ref: "#/components/schemas/UTCTimestamp"}
        completed_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_success_at: {$ref: "#/components/schemas/UTCTimestamp"}
        metrics:
          type: object
          additionalProperties: {type: integer}
        failure: {$ref: "#/components/schemas/OperationsFailure"}
    OperationsSource:
      type: object
      additionalProperties: false
      required: [id, source_key, name, enabled, allowed_categories, paper_count, checkpoint_state, operational_state]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        source_key: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        enabled: {type: boolean}
        allowed_categories:
          type: array
          uniqueItems: true
          items: {type: string}
        paper_count: {type: integer, format: int64, minimum: 0}
        latest_paper_at: {$ref: "#/components/schemas/UTCTimestamp"}
        last_successful_sync_at: {$ref: "#/components/schemas/UTCTimestamp"}
        checkpoint_state: {type: string, enum: [current, stale, never_synced, disabled]}
        operational_state: {type: string, enum: [available, unavailable]}
        latest_attempt: {$ref: "#/components/schemas/OperationsSourceAttempt"}
    OperationsSources:
      type: object
      additionalProperties: false
      required: [generated_at, items]
      properties:
        generated_at: {$ref: "#/components/schemas/UTCTimestamp"}
        items:
          type: array
          items: {$ref: "#/components/schemas/OperationsSource"}
  responses:
    ValidationError:
      description: Request syntax, parameter, or business validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: request is invalid
            request_id: req_01j_example
    Unauthorized:
      description: Missing, invalid, expired, or tampered bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_UNAUTHORIZED
            message: unauthorized
            request_id: req_01j_example
    Forbidden:
      description: The authenticated account does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_FORBIDDEN
            message: forbidden
            request_id: req_01j_example
    Unavailable:
      description: Authorization or operational status assembly could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SERVICE_UNAVAILABLE
            message: operational status temporarily unavailable
            request_id: req_01j_example
    InvalidCredentials:
      description: Email or password was not accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_INVALID_CREDENTIALS
            message: invalid credentials
            request_id: req_01j_example
    EmailAlreadyRegistered:
      description: The normalized email already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: EMAIL_ALREADY_REGISTERED
            message: email is already registered
            request_id: req_01j_example
    SourceNotFound:
      description: Source does not exist or is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SOURCE_NOT_FOUND
            message: source not found
            request_id: req_01j_example
    SubscriptionNotFound:
      description: Subscription does not exist, is deleted, or belongs to another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SUBSCRIPTION_NOT_FOUND
            message: subscription not found
            request_id: req_01j_example
    PaperNotFound:
      description: No matched paper with this ID is visible to the current user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PAPER_NOT_FOUND
            message: paper not found
            request_id: req_01j_example
    SubscriptionLimitReached:
      description: The user already has 20 active enabled subscriptions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SUBSCRIPTION_LIMIT_REACHED
            message: enabled subscription limit reached
            request_id: req_01j_example
    SubscriptionVersionConflict:
      description: If-Match does not equal the current subscription version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SUBSCRIPTION_VERSION_CONFLICT
            message: subscription version conflict
            request_id: req_01j_example
    MethodNotAllowed:
      description: The path exists but does not support the request method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: METHOD_NOT_ALLOWED
            message: method not allowed
            request_id: req_01j_example
    InternalError:
      description: Unexpected server failure; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: internal server error
            request_id: req_01j_example
