root /srv/signalwatch-web/current;
autoindex off;
open_file_cache off;

location = /api { include /etc/nginx/snippets/proxy.conf; }
location ^~ /api/ { include /etc/nginx/snippets/proxy.conf; }
location = /healthz { include /etc/nginx/snippets/proxy.conf; }
location = /readyz { include /etc/nginx/snippets/proxy.conf; }

location ^~ /assets/ {
    root /srv/signalwatch-web;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location = /index.html {
    try_files /index.html =404;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
}

# Match the existing BrowserRouter routes; unknown files never become HTML.
location ~ ^/(?:|login|register|app|papers|subscriptions|settings|api-keys)$ {
    rewrite ^ /index.html last;
}
location / { return 404; }

location @api_bad_gateway {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;
    return 502 '{"code":"GATEWAY_UNAVAILABLE","message":"API temporarily unavailable","request_id":"$request_id"}';
}
location @api_timeout {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;
    return 504 '{"code":"GATEWAY_TIMEOUT","message":"API response timed out","request_id":"$request_id"}';
}
location @api_too_large {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    return 413 '{"code":"VALIDATION_ERROR","message":"request body too large","request_id":"$request_id"}';
}
