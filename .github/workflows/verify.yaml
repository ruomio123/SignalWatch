name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      M1_TEST_MYSQL_DSN: root:isolated-test-only@tcp(127.0.0.1:13306)/signalwatch_test?parseTime=true&loc=UTC
      M4_TEST_SMTP_ADDR: 127.0.0.1:11025
      TEST_REDIS_ADDR: 127.0.0.1:16379
      SIGNALWATCH_INTEGRATION_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - run: docker compose -p signalwatch-refactor-test -f deploy/compose.test.yaml up -d --wait
      - run: goose -dir migrations mysql "$M1_TEST_MYSQL_DSN" up
      - run: npm --prefix web ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: scripts/verify.sh
      - run: scripts/test-migrations.sh
      - run: bash scripts/test-ai-call-migration.sh
      - run: git diff --exit-code -- web/static
      - name: Show test service diagnostics on failure
        if: failure()
        run: |
          docker compose -p signalwatch-refactor-test -f deploy/compose.test.yaml ps -a
          docker compose -p signalwatch-refactor-test -f deploy/compose.test.yaml logs --no-color --tail=200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: web/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -p signalwatch-refactor-test -f deploy/compose.test.yaml down
